name: Bug Report
description: Report a bug or error in this project
title: "[BUG] "
labels: ["t: bug", "s: triage-needed"]
assignees: [coatless]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Our projects are maintained by volunteers, so while we appreciate your report, we cannot guarantee how quickly it will be addressed.

  - type: input
    id: version
    attributes:
      label: Version
      description: The release, tag or commit you are using
      placeholder: e.g., 1.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal reproducible example, with the command or code that failed and its full message
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions of the language and other software involved, and any relevant logs
